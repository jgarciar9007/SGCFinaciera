services:
  api:
    build: ./server
    container_name: sgcf-api
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:Cndes2026*@192.168.20.3:5432/sgcf_db?schema=public
      - PORT=3000
    restart: always

  web:
    build: ./client
    container_name: sgcf-web
    ports:
      - "80:80"
    depends_on:
      - api
    restart: always
